[project]
name = "forge"
version = "0.0.1"
description = "Route-grounded generative design of synthetically executable ionizable lipids"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"

dependencies = [
    "rdkit>=2024.3.1",
    "numpy>=1.24",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "pyyaml>=6.0",
    "tqdm>=4.65",
]

[project.optional-dependencies]
# M0-06 feasibility probe only. Not for training runs.
torch = ["torch>=2.2", "torch-geometric>=2.5"]
# M0-07 oracle matrix and released-checkpoint diagnostics.
oracle = ["torch>=2.2", "xgboost>=2.0", "matplotlib>=3.8"]
report = ["reportlab>=5.0", "pypdf>=6.0"]
dev = ["pytest>=7.4", "pytest-cov>=4.1", "ruff>=0.4", "black>=24.3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/forge"]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "needs_vendor: requires `make vendor` to have run",
    "needs_r1: requires the optional 96 MB R1 asset",
]
