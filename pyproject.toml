[project]
name = "forge"
version = "0.0.1"
description = "Route-grounded generative design of synthetically executable ionizable lipids"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"

dependencies = [
    "rdkit>=2024.3.1",
    "numpy>=1.24",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "pyyaml>=6.0",
    "tqdm>=4.65",
]

[project.optional-dependencies]
# M0-06 feasibility probe only. Not for training runs.
torch = ["torch>=2.2", "torch-geometric>=2.5"]
# M0-07 oracle matrix and released-checkpoint diagnostics.
oracle = ["torch>=2.2", "xgboost>=2.0", "matplotlib>=3.8"]
report = ["reportlab>=5.0", "pypdf>=6.0"]
dev = ["pytest>=7.4", "pytest-cov>=4.1", "ruff>=0.4", "black>=24.3", "mypy>=1.11"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/forge"]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]

[tool.mypy]
# Annotation coverage is already near-total (99.4% of returns, 100% of parameters); what is thin
# is the modelling -- dict[str, Any] appears ~2,000 times and there are no NewTypes. So this
# starts permissive against the existing tree and is ratcheted as modules migrate onto forge.core.
# Do not turn on the strict family globally: it would report thousands of errors at once and stop
# being a signal. Tighten per package instead, via the overrides below.
# No python_version pin: the project supports >=3.10, but pinning 3.10 here makes mypy reject the
# numpy stubs shipped for the 3.14 interpreter this venv uses. Version-compatibility is a ruff
# concern (target-version below); mypy runs against whatever interpreter is active.
files = ["src/forge"]
ignore_missing_imports = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
# New code is held to the standard the rest is moving toward. Everything in forge.core is written
# after this config exists, so there is no legacy to grandfather.
module = ["forge.core.*", "forge.generate.*"]
disallow_untyped_defs = true
disallow_any_generics = true
strict_equality = true
warn_return_any = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "needs_vendor: requires `make vendor` to have run",
    "needs_r1: requires the optional 96 MB R1 asset",
]
